<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NASS Demo</title>
    <link rel="stylesheet" href="./src/entries/index.css" />
    <link rel="stylesheet" href="./src/entries/icons.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="demo-shell">
      <header class="panel demo-hero">
        <div class="eyebrow">Not A Style System</div>
        <h1>NASS</h1>
        <p class="demo-copy">
          A thin CSS foundation with semantic tokens, themes, and reusable
          primitives.
        </p>
        <div class="demo-actions">
          <button class="btn btn-primary" id="theme-toggle">Toggle theme</button>
          <button class="btn btn-secondary">Secondary</button>
          <button class="btn btn-ghost">Ghost</button>
        </div>
      </header>

      <section class="demo-grid">
        <article class="card">
          <div class="card-body">
            <div class="eyebrow">Alerts</div>
            <div class="demo-stack">
              <div class="alert alert-info">Info state</div>
              <div class="alert alert-success">Success state</div>
              <div class="alert alert-warning">Warning state</div>
              <div class="alert alert-error">Error state</div>
            </div>
          </div>
        </article>

        <article class="card">
          <div class="card-body demo-stack">
            <div class="eyebrow">Forms</div>
            <label class="field">
              <span class="label">Name</span>
              <input class="input" placeholder="Bookmark library" />
            </label>
            <label class="field">
              <span class="label">Mode</span>
              <select class="select">
                <option>Local</option>
                <option>Imported</option>
              </select>
            </label>
            <label class="field">
              <span class="label">Notes</span>
              <textarea class="textarea" placeholder="Describe the library."></textarea>
            </label>
          </div>
        </article>

        <article class="card">
          <div class="card-body demo-stack">
            <div class="eyebrow">Utilities</div>
            <div class="badge">Beta</div>
            <div class="menu-item">Menu row</div>
            <div class="panel">Panel surface</div>
            <div class="demo-icon-row">
              <span class="icon-mask demo-icon" style="color: var(--color-icon)">
              </span>
              <span class="icon-mask demo-icon demo-icon-bookmark"></span>
              <span class="spinner" aria-hidden="true"></span>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
